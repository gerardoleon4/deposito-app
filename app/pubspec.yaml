name: deposito_app
description: Anaquel, punto de venta e inventario del depósito. Modo Caja (iPad) y modo Terminal (teléfonos).
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  deposito_backend:
    path: ../backend
  dio: any
  flutter_riverpod: any
  go_router: any
  mobile_scanner: any
  path_provider: any
  pdf: any
  printing: any
  qr_flutter: any
  share_plus: any
  shared_preferences: any
  web_socket_channel: any

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Barlow (licencia OFL, assets/fonts/OFL.txt). Va dentro de la app porque
  # el depósito no tiene internet.
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
