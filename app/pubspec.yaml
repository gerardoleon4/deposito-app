name: deposito_app
description: Anaquel, punto de venta e inventario del depósito. Modo Caja (iPad) y modo Terminal (teléfonos).
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  deposito_backend:
    path: ../backend
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  qr_flutter: ^4.1.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  web_socket_channel: ^3.0.3
  intl: ^0.20.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  network_image_mock: ^2.1.1

flutter:
  uses-material-design: true

  # Barlow (licencia OFL, assets/fonts/OFL.txt). Va dentro de la app porque
  # el depósito no tiene internet.
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
    - family: Barlow Condensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
