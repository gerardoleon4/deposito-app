<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POS Depósito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4ECEE; --surface:#FFFFFF; --surface-2:#F1F5F6; --surface-3:#E7EEF0; --ink:#1B2226; --ink-2:#56646B; --line:#CFDADE;
  --vidrio:#3A2518; --vidrio-2:#4E3322; --vidrio-ink:#F6E7D2; --vidrio-ink-2:#C9AE8E;
  --lager:#F0A500; --lager-ink:#2A1A00; --lager-soft:#FFF1CC;
  --verde:#2E6B4E; --verde-soft:#DDEFE5; --alerta:#B8322A; --alerta-soft:#F9E0DD; --azul:#2F6690;
  --pbg-cerveza:#F5E3C3; --pbg-refresco:#F4DEDC; --pbg-botana:#F7E6C8; --pbg-hielo:#D9ECF4; --pbg-otro:#E5E9EA;
  --papel:#FFFDF6; --papel-ink:#2B2B2B; --sel:#3A2518; --sel-ink:#F6E7D2;
  --shadow:0 1px 2px rgba(20,35,40,.06),0 8px 24px -12px rgba(20,35,40,.18);
  --cond:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F171A; --surface:#172226; --surface-2:#1F2C31; --surface-3:#26353B; --ink:#E7EEF0; --ink-2:#9AAAB0; --line:#2E3E44;
    --vidrio:#24160D; --vidrio-2:#352216; --vidrio-ink:#F3E1C7; --vidrio-ink-2:#B89A78;
    --lager:#F4B324; --lager-ink:#2A1A00; --lager-soft:#3A2C0C;
    --verde:#5BB287; --verde-soft:#193428; --alerta:#E8645B; --alerta-soft:#3A1A18; --azul:#6FA8D6;
    --pbg-cerveza:#3A2E1C; --pbg-refresco:#3A2322; --pbg-botana:#3B301E; --pbg-hielo:#1D3440; --pbg-otro:#2A3336; --sel:#F4B324; --sel-ink:#2A1A00;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0F171A; --surface:#172226; --surface-2:#1F2C31; --surface-3:#26353B; --ink:#E7EEF0; --ink-2:#9AAAB0; --line:#2E3E44;
  --vidrio:#24160D; --vidrio-2:#352216; --vidrio-ink:#F3E1C7; --vidrio-ink-2:#B89A78;
  --lager:#F4B324; --lager-ink:#2A1A00; --lager-soft:#3A2C0C;
  --verde:#5BB287; --verde-soft:#193428; --alerta:#E8645B; --alerta-soft:#3A1A18; --azul:#6FA8D6;
  --pbg-cerveza:#3A2E1C; --pbg-refresco:#3A2322; --pbg-botana:#3B301E; --pbg-hielo:#1D3440; --pbg-otro:#2A3336; --sel:#F4B324; --sel-ink:#2A1A00;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
#app{height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lager);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--cond);font-weight:700;line-height:1.05;margin:0}
small{font-size:14px}
.muted{color:var(--ink-2)}
svg.ico{width:22px;height:22px;flex-shrink:0}

/* Imagen de producto */
.pimg{display:grid;place-items:center;overflow:hidden;border-radius:12px;flex-shrink:0}
.pimg svg{width:100%;height:100%;display:block}
img.pimg{object-fit:cover;background:var(--surface-2)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 16px;font-weight:600;text-align:center;line-height:1.2}
.btn:hover{background:var(--surface-2)}
.btn-sm{min-height:38px;padding:5px 12px;font-size:15px}
.btn-lg{min-height:62px;font-size:19px}
.btn-primary{background:var(--lager);border-color:var(--lager);color:var(--lager-ink)}
.btn-primary:hover{background:var(--lager);filter:brightness(1.05)}
.btn-dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn-dark:hover{background:var(--ink);opacity:.9}
.btn-danger{color:var(--alerta);border-color:var(--alerta)}
.btn-ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.full{width:100%}
.icon-btn{width:46px;height:46px;display:inline-grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:0}
.badge{min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--alerta);color:#fff;font-size:13px;font-weight:600;display:inline-grid;place-items:center;font-family:var(--body)}
.nav button[aria-current="page"] .badge{background:var(--vidrio);color:var(--vidrio-ink)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#46C281;margin-right:7px;vertical-align:1px}
.dot.off{background:#9A8B7A}

/* Caja */
.caja{display:grid;grid-template-columns:236px 1fr;height:100%}
.rail{background:var(--vidrio);color:var(--vidrio-ink);display:flex;flex-direction:column;padding:20px 14px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 20px}
.brand-mark{width:42px;height:42px;border-radius:12px;background:var(--lager);display:grid;place-items:center;flex-shrink:0}
.brand-mark svg{width:28px;height:28px}
.brand b{display:block;font-family:var(--cond);font-weight:700;font-size:26px;line-height:1}
.brand small{display:block;color:var(--vidrio-ink-2);font-weight:500}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;text-align:left;border:0;background:transparent;color:var(--vidrio-ink);padding:9px 12px;border-radius:10px;font-weight:500;font-size:18px;min-height:48px}
.nav button .lbl{flex:1}
.nav button:hover{background:var(--vidrio-2)}
.nav button[aria-current="page"]{background:var(--lager);color:var(--lager-ink);font-weight:600}
.rail-foot{margin-top:auto;padding:16px 8px 0;font-size:14px;color:var(--vidrio-ink-2);display:grid;gap:4px}
.rail-foot b{color:var(--vidrio-ink);font-weight:600}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--surface)}
.topbar h1{font-size:34px;flex:1}
.pill{font-size:14px;font-weight:500;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap}
.host{flex:1;min-height:0;overflow:auto;padding:20px 24px 28px}
.host-fixed{overflow:hidden;padding-bottom:20px}

/* Tablero */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.hello h2{font-size:40px}
.hello p{margin:4px 0 0;color:var(--ink-2)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start}
.kpi .kico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;background:var(--lager-soft);color:var(--ink)}
.kpi .kico.g{background:var(--verde-soft);color:var(--verde)}
.kpi .kico.r{background:var(--alerta-soft);color:var(--alerta)}
.kpi .kico.b{background:var(--surface-3);color:var(--azul)}
.kpi small{color:var(--ink-2);display:block}
.kpi b{display:block;font-family:var(--cond);font-size:34px;line-height:1.05}
.dash{display:grid;grid-template-columns:1.6fr 1fr;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.card-h h3{font-size:24px}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--body);fill:var(--ink-2)}
.rank{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border-bottom:0}
.rank .pimg{width:48px;height:48px}
.rank .info{flex:1;min-width:0}
.rank .info b{display:block;line-height:1.2}
.rank .num{font-family:var(--cond);font-size:24px;font-weight:700}
.stack-cards{display:grid;gap:18px;align-content:start}

/* Vender */
.sell{display:grid;grid-template-columns:1fr 400px;gap:20px;height:100%}
.sell-left{display:flex;flex-direction:column;min-height:0}
.toolbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:160px;min-height:50px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--sel-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:12px;overflow:auto;align-content:start;flex:1;min-height:0;padding:2px 2px 8px}
.tile{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 10px 12px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);transition:transform .08s}
.tile:hover{border-color:var(--lager)}
.tile:active{transform:scale(.97)}
.tile .pimg{width:100%;height:104px;margin-bottom:8px}
.tile .nm{font-weight:600;line-height:1.2;font-size:17px;padding:0 4px}
.tile .fm{font-size:14px;color:var(--ink-2);padding:0 4px}
.tile .pr{font-family:var(--cond);font-weight:700;font-size:30px;line-height:1;margin-top:6px;padding:0 4px}
.tile .pr span{font-family:var(--body);font-size:13px;font-weight:500;color:var(--ink-2);margin-left:5px}
.tile .st{font-size:13px;color:var(--ink-2);padding:0 4px}
.tile .st.low{color:var(--alerta);font-weight:600}
.tile .incart{position:absolute;top:8px;right:8px;background:var(--lager);color:var(--lager-ink);font-weight:700;border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;padding:0 8px;font-size:14px;box-shadow:var(--shadow)}
.tile.out{opacity:.5}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;min-height:0;box-shadow:var(--shadow)}
.ticket-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.ticket-head h2{font-size:26px}
.ticket-head small{display:block;color:var(--ink-2);font-family:var(--body);font-weight:500}
.lines{flex:1;overflow:auto;padding:4px 16px;min-height:80px}
.empty{color:var(--ink-2);text-align:center;padding:28px 12px}
.empty svg{width:120px;height:auto;display:block;margin:0 auto 10px}
.line{padding:12px 0;border-bottom:1px dashed var(--line);display:grid;grid-template-columns:48px 1fr;gap:10px;border-radius:8px}
.line:last-child{border-bottom:0}
.line .pimg{width:48px;height:48px;border-radius:10px}
.line.flash{animation:flash .7s ease-out}
@keyframes flash{from{background:var(--lager-soft)}to{background:transparent}}
.line-top{display:flex;justify-content:space-between;gap:8px;font-weight:600;line-height:1.2}
.line-bot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:14px;font-weight:600;color:var(--ink-2);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--sel-ink)}
.seg.wide{display:grid;grid-template-columns:repeat(3,1fr);width:100%}
.qty{display:inline-flex;align-items:center;gap:8px}
.qty button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-weight:700;font-size:20px;line-height:1}
.qty span{min-width:26px;text-align:center;font-weight:600;font-size:18px}
.env{padding:12px 16px;border-top:1px solid var(--line);font-size:15px;display:grid;gap:8px}
.env-title{display:flex;align-items:center;gap:8px;font-weight:600}
.env-row{display:flex;justify-content:space-between;color:var(--ink-2)}
.total{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.total b{font-family:var(--cond);font-size:54px;line-height:1;font-weight:700}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px}
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--lager-soft);border:1px solid var(--lager);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.banner small{display:block;color:var(--ink-2)}
.banner-act{display:flex;gap:8px;flex-shrink:0}
.ban-imgs{display:flex;margin-right:4px}
.ban-imgs .pimg{width:34px;height:34px;border-radius:50%;border:2px solid var(--lager-soft);margin-left:-8px}
.ban-imgs .pimg:first-child{margin-left:0}

/* Tablas, paneles y listas */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-weight:600;color:var(--ink-2);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td small{display:block;color:var(--ink-2)}
.cell-prod{display:flex;align-items:center;gap:12px}
.cell-prod .pimg{width:46px;height:46px;border-radius:10px}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.tag.low{background:var(--alerta-soft);color:var(--alerta);border-color:transparent}
.tag.ok{background:var(--verde-soft);color:var(--verde);border-color:transparent}
.tag.warn{background:var(--lager-soft);color:var(--ink);border-color:var(--lager)}
.row-actions{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px;gap:12px;flex-wrap:wrap}
.row-actions h2{font-size:26px}
.row-actions .acts{display:flex;gap:8px;flex-wrap:wrap}
.panels{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.panel h3{font-size:24px;margin-bottom:8px}
.env-panel{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center}
.env-panel .pimg{width:84px;height:100px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;color:var(--ink-2)}
.kv b{color:var(--ink);font-variant-numeric:tabular-nums}
.kv.sum{border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.big{font-family:var(--cond);font-size:44px;font-weight:700;line-height:1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.list > h3{padding:14px 16px;border-bottom:1px solid var(--line);font-size:24px}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li small{display:block;color:var(--ink-2)}
.li .acts{display:flex;gap:8px;align-items:center;flex-shrink:0}
.li .who{display:flex;align-items:center;gap:12px;min-width:0}
.li .who .pimg{width:46px;height:46px;border-radius:10px}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--surface-3);color:var(--ink);flex-shrink:0}
.bar{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--lager);border-radius:999px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:15px;color:var(--ink-2)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;color:var(--ink);min-height:48px;font-size:17px}
.field input[type="color"]{padding:4px;min-height:44px;width:100%}
.check{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.check input{width:22px;height:22px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.form .span{grid-column:1/-1}
.diff-ok{color:var(--verde)} .diff-bad{color:var(--alerta)}
.section{margin-bottom:22px}
.section > h2{font-size:26px;margin-bottom:10px}
.note{font-size:15px;color:var(--ink-2);margin:8px 0 0}
.donut-wrap{display:flex;align-items:center;gap:18px}
.donut-wrap svg{width:140px;height:140px;flex-shrink:0}
.legend{display:grid;gap:6px}
.legend span{display:flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}

/* Imagen en el formulario */
.img-edit{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start;margin-bottom:14px}
.img-edit .pimg{width:150px;height:150px}
.img-tools{display:grid;gap:10px}
.img-tools .form{grid-template-columns:repeat(3,1fr);gap:0 10px}

/* Modal y avisos */
.modal-bg{position:fixed;inset:0;background:rgba(10,16,19,.55);display:grid;place-items:center;z-index:50;padding:20px;backdrop-filter:blur(2px)}
.modal-bg[hidden]{display:none}
.modal{background:var(--surface);border-radius:20px;padding:24px;width:min(470px,100%);max-height:calc(100% - 20px);overflow:auto;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);animation:pop .16s ease-out}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.modal.wide{width:min(700px,100%)}
.modal.xwide{width:min(860px,100%)}
.modal h2{font-size:32px;margin-bottom:4px}
.modal > p{margin:0 0 16px;color:var(--ink-2)}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.keypad button{min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:24px;font-weight:600}
.keypad button:active{background:var(--lager-soft)}
.change{background:var(--surface-2);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.change b{font-family:var(--cond);font-size:46px;line-height:1}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.share{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.split{display:grid;grid-template-columns:320px 1fr;gap:22px;align-items:start}
.qrbox{background:#fff;border-radius:12px;padding:12px;width:max-content;margin:4px auto 12px}
.qrbox svg,.qrbox img{display:block;width:220px;height:220px}
.addr{text-align:center;font-family:var(--cond);font-size:30px;font-weight:600;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:min(560px,calc(100% - 32px));text-align:center}
.toast.show{opacity:1}
body[data-rol="terminal"] .toast{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.detail{display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start}
.detail .pimg{width:200px;height:200px}
.detail .pr{font-family:var(--cond);font-size:44px;font-weight:700;line-height:1;margin:8px 0}

/* Recibo */
.recibo{margin-bottom:14px;background:var(--papel);color:var(--papel-ink);font-family:"Courier New",Courier,monospace;font-size:13.5px;line-height:1.45;padding:20px 18px 26px;position:relative;box-shadow:0 10px 30px -12px rgba(0,0,0,.35);border-radius:4px 4px 0 0}
.recibo::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:linear-gradient(-45deg,transparent 7px,var(--papel) 0) 0 0/14px 10px repeat-x,linear-gradient(45deg,transparent 7px,var(--papel) 0) 0 0/14px 10px repeat-x}
.recibo .c{text-align:center}
.recibo .h{font-size:18px;font-weight:700;letter-spacing:.04em}
.recibo .r{display:flex;justify-content:space-between;gap:10px}
.recibo .hr{border-top:1px dashed #9a9a9a;margin:8px 0}
.recibo .t{font-size:17px;font-weight:700}
.recibo .sello{margin-top:8px;border:2px solid #B8322A;color:#B8322A;text-align:center;font-weight:700;padding:2px;transform:rotate(-4deg)}

/* Cámara */
.cam{position:relative;height:300px;background:#1A1512;border-radius:14px;overflow:hidden;margin-bottom:14px}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam-msg{position:absolute;left:12px;right:12px;bottom:12px;text-align:center;color:#F1E6D8;font-size:14px;background:rgba(0,0,0,.55);padding:8px 10px;border-radius:8px}
.corner{position:absolute;width:36px;height:36px;border:4px solid var(--lager)}
.c1{top:34px;left:34px;border-right:0;border-bottom:0;border-radius:8px 0 0 0}
.c2{top:34px;right:34px;border-left:0;border-bottom:0;border-radius:0 8px 0 0}
.c3{bottom:60px;left:34px;border-right:0;border-top:0;border-radius:0 0 0 8px}
.c4{bottom:60px;right:34px;border-left:0;border-top:0;border-radius:0 0 8px 0}
.scanline{position:absolute;left:44px;right:44px;top:45%;height:2px;background:var(--lager);box-shadow:0 0 12px var(--lager);animation:scan 2.2s ease-in-out infinite alternate}
@keyframes scan{from{top:22%}to{top:66%}}
.pick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px;font-size:14px;color:var(--ink-2)}
.pick .chip{min-height:38px;padding:3px 12px 3px 4px;font-size:14px}
.pick .chip .pimg{width:30px;height:30px;border-radius:50%}

/* Terminal */
.term{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;background:var(--bg)}
.term-top{background:var(--vidrio);color:var(--vidrio-ink);padding:18px 20px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.term-top h1{font-size:36px}
.term-top div small{color:var(--vidrio-ink-2);display:block;margin-top:4px}
.term-top .icon-btn{background:var(--vidrio-2);border-color:transparent;color:var(--vidrio-ink)}
.term-body{flex:1;overflow:auto;padding:18px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 6px 10px}
.tabs button{border:0;background:transparent;padding:8px 4px;border-radius:12px;font-weight:600;font-size:14px;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px}
.tabs button[aria-current="page"]{color:var(--ink);background:var(--lager-soft)}
.scan-big{width:100%;min-height:150px;border:2px dashed var(--lager);background:var(--surface);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:20px;margin-bottom:14px}
.scan-big svg{width:44px;height:44px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px;box-shadow:var(--shadow)}
.pcard .top{display:flex;gap:14px;align-items:center}
.pcard .top .pimg{width:110px;height:110px}
.pcard .nm{font-weight:600;font-size:20px;line-height:1.2}
.pcard .pr{font-family:var(--cond);font-size:40px;font-weight:700;line-height:1;margin-top:6px}
.stack{display:flex;flex-direction:column;gap:10px}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0;min-height:50px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tgrid .tile .pimg{height:90px}

/* Inicio */
.start{min-height:100%;display:grid;place-items:center;padding:40px 24px}
.start-in{max-width:860px;width:100%}
.hero{display:grid;grid-template-columns:1fr 320px;gap:28px;align-items:center;margin-bottom:26px}
.hero svg{width:100%;height:auto}
.start h1{font-size:54px;margin-bottom:10px}
.start-in p.lead{color:var(--ink-2);margin:0;font-size:18px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.choice{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:22px;min-height:170px;display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:start;box-shadow:var(--shadow)}
.choice:hover{border-color:var(--lager)}
.choice[aria-pressed="true"]{border-color:var(--lager);background:var(--lager-soft)}
.choice .cico{width:56px;height:56px;border-radius:14px;background:var(--lager);color:var(--lager-ink);display:grid;place-items:center}
.choice .cico svg{width:30px;height:30px}
.choice b{display:block;font-family:var(--cond);font-size:34px;line-height:1;margin-bottom:8px}
.choice span{color:var(--ink-2)}
.next{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.next h2{font-size:28px;margin-bottom:6px}

@media (prefers-reduced-motion: reduce){.scanline,.line.flash,.modal{animation:none}.toast,.tile{transition:none}}
@media (max-width:1240px){ .caja{grid-template-columns:204px 1fr} .nav button{font-size:17px} .sell{grid-template-columns:1fr 352px} .grid{grid-template-columns:repeat(auto-fill,minmax(148px,1fr))} .tile .pimg{height:86px} .tile .pr{font-size:26px} }
@media (max-width:1100px){ .kpis{grid-template-columns:repeat(2,1fr)} .dash{grid-template-columns:1fr} .sell{grid-template-columns:1fr 350px} }
@media (max-width:900px){
  .caja{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .rail{flex-direction:row;align-items:center;padding:8px;overflow-x:auto}
  .brand,.rail-foot{display:none}
  .nav{flex-direction:row}
  .nav button{white-space:nowrap;min-height:44px;font-size:16px}
  .topbar{padding:10px 16px}
  .topbar h1{font-size:28px}
  .topbar .pill{display:none}
  .host{padding:16px}
  .host-fixed{overflow:auto}
  .sell{grid-template-columns:1fr;height:auto}
  .grid{overflow:visible}
  .panels,.two,.choices,.form,.split,.hero,.detail,.img-edit{grid-template-columns:1fr}
  .start h1{font-size:40px}
}
@media (max-width:560px){ .kpis{grid-template-columns:1fr} }
</style>
</head>
<body>
<div id="app"></div>
<div class="modal-bg" id="modal" hidden><div class="modal" id="modal-box" role="dialog" aria-modal="true"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
(function(){
"use strict";

/* ================= Utilidades ================= */
const $ = s => document.querySelector(s);
const DAY = 864e5;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => { const v = Math.round((+n || 0) * 100) / 100; return "$" + v.toLocaleString("es-MX", { minimumFractionDigits: v % 1 ? 2 : 0, maximumFractionDigits: 2 }); };
const hoy0 = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const addDays = (d, n) => new Date(d.getTime() + n * DAY);
const isoDate = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const diasPara = s => s ? Math.round((new Date(s + "T00:00:00") - hoy0()) / DAY) : null;
const fHora = s => new Date(s).toLocaleTimeString("es-MX", { hour:"2-digit", minute:"2-digit" });
const fFecha = s => new Date(s).toLocaleDateString("es-MX", { day:"numeric", month:"short" });
const fFechaHora = s => new Date(s).toLocaleString("es-MX", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
const fCad = s => s ? new Date(s + "T00:00:00").toLocaleDateString("es-MX", { day:"numeric", month:"short", year:"numeric" }) : "Sin fecha";
const plural = (n, a, b) => n + " " + (n === 1 ? a : b);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const CATS = [["cerveza","Cerveza"],["refresco","Refrescos"],["botana","Botanas"],["hielo","Hielo"],["otro","Otros"]];
const CATN = Object.fromEntries(CATS);
const ENVN = { mega:"Mega", media:"Media", cuarto:"Cuarto" };
const FORMAS = [["mega","Botella mega"],["media","Botella media"],["cuarto","Botella cuarto"],["lata","Lata"],["pet","Botella de plástico"],["bolsa","Bolsa"],["hielo","Bolsa de hielo"],["caja","Caja"]];
const lsGet = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch(e) { return false; } };
const ssGet = k => { try { return sessionStorage.getItem(k); } catch(e) { return null; } };
const ssSet = (k, v) => { try { sessionStorage.setItem(k, v); } catch(e) {} };
const reduceMotion = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ================= Íconos ================= */
const IC = {
  inicio:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  vender:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h9.6a1 1 0 0 0 1-.8L21 7H6"/>',
  ventas:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h3"/>',
  catalogo:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  envases:'<path d="M10 2h4v4l2 3v12a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V9l2-3z"/><path d="M8 13h8"/>',
  corte:'<rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="3"/><path d="M6 10v5M18 10v5"/>',
  alertas:'<path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/>',
  resurtido:'<path d="M2 6h11v10H2zM13 10h4l4 4v2h-8z"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
  ajustes:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>',
  escanear:'<path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M8 8v8M11 8v8M14 8v8M17 8v8"/>',
  pedido:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/>',
  stock:'<path d="M3 8l9-5 9 5-9 5zM3 8v8l9 5 9-5V8M12 13v8"/>',
  sol:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  luna:'<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  auto:'<circle cx="12" cy="12" r="9"/><path d="M12 3v18" /><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>',
  qr:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3M21 14v7h-7M17 21v-3"/>',
  caja:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  tel:'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
  dinero:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',
  ticket:'<path d="M4 7a2 2 0 0 0 2-2h12a2 2 0 0 0 2 2v2a3 3 0 0 0 0 6v2a2 2 0 0 0-2 2H6a2 2 0 0 0-2-2v-2a3 3 0 0 0 0-6z"/>',
  mas:'<path d="M12 5v14M5 12h14"/>',
  wifi:'<path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1"/>'
};
const ico = (k, cls) => `<svg class="ico ${cls || ""}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;

/* ================= Ilustraciones de producto ================= */
const FORM_DIMS = { mega:{y0:16,ys:36,y1:54,y2:108,nw:13,bw:40}, media:{y0:22,ys:44,y1:60,y2:106,nw:11,bw:32}, cuarto:{y0:40,ys:56,y1:68,y2:104,nw:10,bw:27}, pet:{y0:20,ys:30,y1:46,y2:108,nw:15,bw:38} };
function botella(o, c1, c2, c3, pet){
  const c = 60, L = c - o.bw/2, R = c + o.bw/2, nl = c - o.nw/2, nr = c + o.nw/2;
  const d = `M${nl} ${o.y0} L${nl} ${o.ys} C${nl} ${o.ys+10} ${L} ${o.y1-10} ${L} ${o.y1} L${L} ${o.y2-6} Q${L} ${o.y2} ${L+6} ${o.y2} L${R-6} ${o.y2} Q${R} ${o.y2} ${R} ${o.y2-6} L${R} ${o.y1} C${R} ${o.y1-10} ${nr} ${o.ys+10} ${nr} ${o.ys} L${nr} ${o.y0} Z`;
  const lh = (o.y2 - o.y1) * (pet ? .34 : .42), ly = o.y1 + (o.y2 - o.y1) * (pet ? .22 : .28);
  let s = `<path d="${d}" fill="${c1}" ${pet ? 'fill-opacity=".85"' : ""}/>`;
  if (pet) s += `<path d="M${L} ${o.y2-14} H${R} M${L} ${o.y2-22} H${R}" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>`;
  s += `<rect x="${L}" y="${ly}" width="${o.bw}" height="${lh}" fill="${c2}"/>`;
  s += `<rect x="${L}" y="${ly + lh*.7}" width="${o.bw}" height="${lh*.12}" fill="#fff" fill-opacity=".5"/>`;
  s += `<circle cx="${c}" cy="${ly + lh*.38}" r="${Math.min(o.bw, lh) * .2}" fill="#fff" fill-opacity=".55"/>`;
  s += `<rect x="${nl-1.5}" y="${o.y0-6}" width="${o.nw+3}" height="8" rx="2" fill="${c3}"/>`;
  if (!pet) s += `<rect x="${nl}" y="${o.ys-5}" width="${o.nw}" height="6" fill="${c2}"/>`;
  s += `<path d="M${L+5} ${o.y1+3} L${L+5} ${o.y2-10}" stroke="#fff" stroke-opacity=".38" stroke-width="3" stroke-linecap="round"/>`;
  return s;
}
function ilusSVG(p){
  const il = p.ilus || { forma:"caja", c1:"#B98B55", c2:"#8C5A2B", c3:"#E3C08F" };
  const bg = `var(--pbg-${CATN[p.cat] ? p.cat : "otro"})`;
  let body = "";
  const f = il.forma;
  if (FORM_DIMS[f]) body = botella(FORM_DIMS[f], il.c1, il.c2, il.c3, f === "pet");
  else if (f === "lata"){
    body = `<rect x="40" y="32" width="40" height="76" rx="7" fill="${il.c1}"/><ellipse cx="60" cy="33" rx="20" ry="5" fill="${il.c3}"/><rect x="40" y="55" width="40" height="30" fill="${il.c2}"/><circle cx="60" cy="70" r="8" fill="#fff" fill-opacity=".55"/><path d="M45 38v62" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>`;
  } else if (f === "bolsa"){
    let top = "M30 30", bot = "";
    for (let x = 30; x < 90; x += 6) top += ` L${x+3} 24 L${x+6} 30`;
    for (let x = 90; x > 30; x -= 6) bot += ` L${x-3} 108 L${x-6} 102`;

      <path d="M29 50 H91" stroke="${il.c2}" stroke-width="7"/>
      <ellipse cx="60" cy="78" rx="22" ry="17" fill="#fff" fill-opacity=".85"/>
      <circle cx="52" cy="76" r="7" fill="${il.c3}"/><circle cx="64" cy="72" r="6" fill="${il.c3}"/><circle cx="66" cy="84" r="6.5" fill="${il.c3}"/><circle cx="55" cy="86" r="5" fill="${il.c3}"/>
      <path d="M36 36 L34 96" stroke="#fff" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>`;
  } else if (f === "hielo"){
    body = `<path d="M36 42 Q38 30 52 29 L68 29 Q82 30 84 42 L90 100 Q90 109 81 109 L39 109 Q30 109 30 100 Z" fill="${il.c1}" fill-opacity=".92"/>
      <path d="M52 29 Q60 16 68 29" fill="none" stroke="${il.c3}" stroke-width="4" stroke-linecap="round"/><rect x="50" y="25" width="20" height="7" rx="3" fill="${il.c3}"/>
      ${[[44,58],[62,54],[50,76],[68,74],[42,92],[60,93],[76,92]].map(([x,y]) => `<rect x="${x-8}" y="${y-8}" width="16" height="16" rx="4" fill="#fff" fill-opacity=".85" stroke="${il.c2}" stroke-opacity=".5"/>`).join("")}
      <rect x="38" y="62" width="44" height="12" rx="3" fill="${il.c2}" fill-opacity=".9"/>`;
  } else {
    body = `<rect x="22" y="44" width="76" height="60" rx="6" fill="${il.c1}"/><path d="M22 60 H98 M22 76 H98 M22 92 H98" stroke="${il.c2}" stroke-width="3"/><rect x="44" y="50" width="32" height="12" rx="4" fill="${il.c3}"/>`;
  }
  return `<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="64" r="54" style="fill:${bg}"/><ellipse cx="60" cy="110" rx="30" ry="5" fill="#000" fill-opacity=".08"/>${body}</svg>`;

const imgProd = (p, cls) => p && p.foto ? `<img class="pimg ${cls || ""}" src="${p.foto}" alt="">` : `<span class="pimg ${cls || ""}">${ilusSVG(p || {})}</span>`;
const imgEnvase = f => imgProd({ cat:"cerveza", ilus:{ forma:f, c1:"#7A5A3A", c2:"#C9B79C", c3:"#9A8B7A" } });

const EMPTY_SVG = `<svg viewBox="0 0 160 110" aria-hidden="true"><rect x="20" y="46" width="120" height="54" rx="8" fill="var(--surface-3)"/><path d="M20 64h120M20 82h120" stroke="var(--line)" stroke-width="3"/><path d="M52 46V26a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v20M92 46V18a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v28" fill="none" stroke="var(--ink-2)" stroke-width="3" stroke-linecap="round"/><rect x="56" y="30" width="8" height="10" rx="2" fill="var(--lager)"/><rect x="96" y="22" width="8" height="12" rx="2" fill="var(--lager)"/></svg>`;
const HERO_SVG = `<svg viewBox="0 0 320 230" aria-hidden="true">
  <rect x="10" y="30" width="210" height="150" rx="16" fill="var(--ink)"/><rect x="20" y="40" width="190" height="130" rx="8" fill="var(--surface)"/>

function leerFoto(file){

    fr.onload = () => { const im = new Image(); im.onload = () => { const s = 360, k = Math.min(1, s / Math.max(im.width, im.height)); const c = document.createElement("canvas"); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL("image/jpeg", .8)); }; im.onerror = rej; im.src = fr.result; };
    fr.onerror = rej; fr.readAsDataURL(file);
  });
}

let camStream = null, camTimer = null;
function stopCam(){ clearInterval(camTimer); camTimer = null; if (camStream){ camStream.getTracks().forEach(t => t.stop()); camStream = null; } }
function abrirScanner(ctx){
  U.scanCtx = ctx;
  const titulo = ctx === "start" ? "Escanear el código de la caja" : "Escanear producto";
  const pruebas = ctx === "start" ? "" : `<div class="pick"><span>Códigos de prueba:</span>${S.productos.slice(0,8).map(p => `<button class="chip" data-act="scan-pick" data-code="${esc(p.codigo)}">${imgProd(p)}${esc(p.nombre)}</button>`).join("")}</div>`;
  openModal(`<h2>${titulo}</h2><p>Apunta la cámara al código. También puedes escribirlo.</p>
    <div class="cam"><video id="camv" playsinline muted></video><span class="corner c1"></span><span class="corner c2"></span><span class="corner c3"></span><span class="corner c4"></span><span class="scanline"></span><div class="cam-msg" id="cammsg">Abriendo la cámara…</div></div>
    <label class="field">Código<input id="scode" inputmode="${ctx === "start" ? "url" : "numeric"}" autocomplete="off" placeholder="${ctx === "start" ? "192.168.1.50:8080" : "7501064191015"}"></label>
    ${pruebas}
    <div class="modal-actions"><button class="btn" data-act="close">Cerrar</button><button class="btn btn-primary" data-act="scan-code">Buscar código</button></div>`, "wide");
  iniciarCamara();
}
async function iniciarCamara(){
  const msg = () => $("#cammsg");
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ if (msg()) msg().textContent = "La cámara no está disponible aquí. Escribe el código o usa uno de prueba."; return; }
  try { camStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" }, audio:false }); }
  catch(e){ if (msg()) msg().textContent = "No se pudo abrir la cámara. Escribe el código o usa uno de prueba."; return; }
  const v = $("#camv"); if (!v){ stopCam(); return; }
  v.srcObject = camStream; try { await v.play(); } catch(e){}
  if (!("BarcodeDetector" in window)){ if (msg()) msg().textContent = "Este navegador no lee códigos con la cámara. En la app Flutter lo hará mobile_scanner. Escribe el código."; return; }
  let det; try { const fm = await window.BarcodeDetector.getSupportedFormats(); det = new window.BarcodeDetector(fm && fm.length ? { formats:fm } : undefined); }
  catch(e){ if (msg()) msg().textContent = "No se pudo iniciar el lector. Escribe el código."; return; }
  if (msg()) msg().textContent = "Apunta al código de barras";
  camTimer = setInterval(async () => {
    const vv = $("#camv"); if (!vv){ stopCam(); return; }
    if (!vv.videoWidth) return;
    try { const r = await det.detect(vv); if (r && r.length){ const c = r[0].rawValue; stopCam(); onCodigo(c); } } catch(e){}
  }, 350);
}
function onCodigo(code){
  code = String(code || "").trim(); if (!code) return;
  const ctx = U.scanCtx;
  if (ctx === "start"){ U.startIp = code.replace(/^https?:\/\//, "").replace(/\/$/, ""); closeModal(); render(); return; }
  const p = byCode(code);
  if (!p){
    if (getRol() === "caja") openModal(`<h2>Código no registrado</h2><p>El código ${esc(code)} no está en el catálogo.</p><div class="modal-actions"><button class="btn" data-act="close">Cerrar</button><button class="btn btn-primary" data-act="prod-nuevo" data-code="${esc(code)}">Registrar producto</button></div>`);
    else { closeModal(); toast(`El código ${code} no está en el catálogo`); }
    return;
  }
  closeModal();
  if (ctx === "pos"){ if (addCart(U.cart, p.id, "pieza", true)){ U.flash = p.id; toast("Agregado: " + p.nombre); } }
  else { U.lastScan = p.id; U.tScreen = "escanear"; try { navigator.vibrate && navigator.vibrate(30); } catch(e){} }
  render();
}

      <span class="seg wide" role="group" aria-label="Envases"><button data-act="envmodo" data-m="cobrar" aria-pressed="${U.envModo === "cobrar"}">Cobrar</button><button data-act="envmodo" data-m="trae" aria-pressed="${U.envModo === "trae"}">Trae vacíos</button><button data-act="envmodo" data-m="prestamo" aria-pressed="${U.envModo === "prestamo"}">Préstamo</button></span>
      ${U.envModo === "prestamo" ? `<input class="search" id="envCliente" placeholder="Nombre del cliente" value="${esc(U.envCliente)}" style="min-height:44px">` : ""}
      <div class="env-row"><span>${U.envModo === "cobrar" ? "Depósito de envases" : U.envModo === "trae" ? "Intercambio de envases" : "Se registran como prestados"}</span><span>${U.envModo === "cobrar" ? money(e.monto) : "$0"}</span></div></div>` : "";

      <div class="toolbar"><input class="search" id="q" type="search" placeholder="Buscar por nombre o código" value="${esc(U.q)}" aria-label="Buscar producto"><button class="btn btn-dark" data-act="scan" data-ctx="pos">${ico("escanear")}Escanear</button></div>

    </div></div>`;
}

function vVentas(){
  let list = S.ventas.filter(v => !v.hist);
  if (U.vf === "turno") list = ventasTurno();
  else if (U.vf === "hoy") list = list.filter(v => v.fecha >= hoy0().toISOString());
  else list = list.filter(v => v.fecha >= addDays(hoy0(), -6).toISOString());
  list = list.slice().sort((a,b) => b.fecha.localeCompare(a.fecha));
  const ok = list.filter(v => !v.cancelada), tot = ok.reduce((a,v)=>a+v.total,0);
  const ef = ok.filter(v => v.metodo === "efectivo").reduce((a,v)=>a+v.total,0);
  const rows = list.map(v => `<tr class="click" data-act="venta-ver" data-id="${v.id}" tabindex="0">
    <td><b>${v.folio}</b></td><td>${U.vf === "7d" ? fFecha(v.fecha) + ", " : ""}${fHora(v.fecha)}</td>
    <td><div class="ban-imgs">${v.items.slice(0,4).map(it => it.pid && P(it.pid) ? imgProd(P(it.pid)) : imgEnvase("mega")).join("")}</div></td>
    <td>${esc(v.items.map(it => it.qty + " " + it.nombre).join(", ")).slice(0,48)}${v.items.length > 2 ? "…" : ""}</td>
    <td>${esc(v.origen)}</td><td>${v.metodo === "efectivo" ? "Efectivo" : "Tarjeta"}</td><td class="num"><b>${money(v.total)}</b></td>
    <td>${v.cancelada ? `<span class="tag low">Cancelada</span>` : v.corteId ? `<span class="tag">En corte</span>` : `<span class="tag ok">Pagada</span>`}</td></tr>`).join("");
  return `<div class="row-actions"><div class="chips" style="margin:0">${[["turno","Este turno"],["hoy","Hoy"],["7d","Últimos 7 días"]].map(([k,t]) => `<button class="chip" data-act="vf" data-f="${k}" aria-pressed="${U.vf === k}">${t}</button>`).join("")}</div></div>
    <div class="two" style="grid-template-columns:1fr 1.4fr">
      <div class="card"><div class="card-h"><h3>Resumen</h3></div><div class="donut-wrap">${donut([{ l:"Efectivo", v:ef, c:"var(--lager)" },{ l:"Tarjeta", v:tot - ef, c:"var(--vidrio)" }])}<div class="legend"><span><i style="background:var(--lager)"></i>Efectivo ${money(ef)}</span><span><i style="background:var(--vidrio)"></i>Tarjeta ${money(tot - ef)}</span><span class="muted">${plural(ok.length,"venta","ventas")}${list.length - ok.length ? `, ${plural(list.length - ok.length,"cancelada","canceladas")}` : ""}</span></div></div></div>
      <div class="card"><div class="card-h"><h3>Últimos 7 días</h3></div>${barChart(datosSemana(), { h:170, fmt:kfmt, hi:6 })}</div>
    </div>
    ${list.length ? `<div class="table-wrap"><table><thead><tr><th>Folio</th><th>Hora</th><th></th><th>Productos</th><th>Origen</th><th>Pago</th><th class="num">Total</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table></div>`
      : `<div class="panel"><div class="empty">${EMPTY_SVG}${U.vf === "turno" && !S.turno.abierto ? "La caja está cerrada. Ábrela en Corte de caja para empezar un turno." : "No hay ventas en este periodo."}</div></div>`}`;
}

function vCatalogo(){
  const q = U.catQ.trim().toLowerCase();
  const list = S.productos.filter(p => (U.catCat === "todo" || p.cat === U.catCat) && (!q || p.nombre.toLowerCase().includes(q) || p.codigo.includes(q)));
  const valor = S.productos.reduce((a,p) => a + p.stock * p.precio, 0);
  const rows = list.map(p => { const d = diasPara(p.cad); return `<tr class="click" data-act="prod-ver" data-id="${p.id}">
    <td><div class="cell-prod">${imgProd(p)}<div><b>${esc(p.nombre)}</b><small>${esc(p.fmt)}, ${esc(p.codigo || "sin código")}</small></div></div></td>
    <td>${CATN[p.cat] || "Otros"}</td>
    <td class="num">${money(p.precio)}${p.precioCaja ? `<small>caja ${money(p.precioCaja)}</small>` : ""}</td>
    <td class="num"><b>${stockTxt(p)}</b><small>${p.stock} pz, mínimo ${p.min}</small></td>
    <td>${p.cad ? `${fCad(p.cad)}${d < 0 ? `<small class="diff-bad">Vencido</small>` : d <= S.ajustes.alertaCad ? `<small>En ${plural(d,"día","días")}</small>` : ""}` : `<span class="muted">Sin fecha</span>`}</td>
    <td>${isLow(p) ? `<span class="tag low">Bajo mínimo</span>` : `<span class="tag ok">Suficiente</span>`}</td>
    <td><div style="display:flex;gap:6px"><button class="btn btn-sm" data-act="recibir" data-id="${p.id}">Recibir</button><button class="btn btn-sm" data-act="prod-editar" data-id="${p.id}">Editar</button></div></td></tr>`; }).join("");
  return `<div class="row-actions"><div class="toolbar" style="margin:0;flex:1"><input class="search" id="catq" type="search" placeholder="Buscar por nombre o código" value="${esc(U.catQ)}" aria-label="Buscar en catálogo"></div>
      <div class="acts"><button class="btn" data-act="csv">Exportar inventario</button><button class="btn btn-primary" data-act="prod-nuevo">${ico("mas")}Agregar producto</button></div></div>
    <div class="row-actions"><div class="chips" style="margin:0">${[["todo","Todo"]].concat(CATS).map(([k,v]) => `<button class="chip" data-act="ccat" data-c="${k}" aria-pressed="${U.catCat === k}">${v}</button>`).join("")}</div><span class="muted">${plural(S.productos.length,"producto","productos")}, inventario valuado en ${money(valor)}</span></div>
    ${list.length ? `<div class="table-wrap"><table><thead><tr><th>Producto</th><th>Categoría</th><th class="num">Precio</th><th class="num">Existencia</th><th>Caducidad</th><th>Estado</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
      : `<div class="panel"><div class="empty">${EMPTY_SVG}No hay productos con ese filtro.</div></div>`}`;
}

function vEnvases(){
  const panels = Object.keys(S.envases).map(k => { const e = S.envases[k], tot = e.bodega + e.prestados; return `<div class="panel env-panel">${imgEnvase(k)}<div><h3>${ENVN[k]}</h3>
    <div class="kv"><span>Vacíos en bodega</span><b>${e.bodega}</b></div><div class="kv"><span>Prestados</span><b>${e.prestados}</b></div><div class="kv"><span>Depósito</span><b>${money(e.precio)}</b></div>
    <div class="bar" title="Prestados"><i style="width:${tot ? Math.round(e.prestados / tot * 100) : 0}%;background:var(--vidrio)"></i></div></div></div>`; }).join("");

    : `<div class="empty">${EMPTY_SVG}No hay envases prestados.</div>`;
  return `<div class="panels">${panels}</div>
    <div class="row-actions"><h2>Préstamos a clientes</h2><div class="acts"><button class="btn" data-act="vender-env">Vender vacíos</button><button class="btn" data-act="recibir-env">Recibir vacíos</button><button class="btn btn-primary" data-act="prestamo">${ico("mas")}Registrar préstamo</button></div></div>
    <div class="list">${lis}</div>`;
}

function vCorte(){
  const hist = S.cortes.slice().reverse().map(c => `<div class="li"><div class="who"><span class="avatar">${ico("corte")}</span><div><b>${cap(fFecha(c.cierre))}, ${fHora(c.apertura)} a ${fHora(c.cierre)}</b><small>${plural(c.ventas,"venta","ventas")}, efectivo ${money(c.efectivo)}, tarjeta ${money(c.tarjeta)}</small></div></div><div class="acts"><span class="${c.diferencia === 0 ? "tag ok" : "tag low"}">${c.diferencia === 0 ? "Cuadró" : (c.diferencia > 0 ? "Sobraron " : "Faltaron ") + money(Math.abs(c.diferencia))}</span><button class="btn btn-sm" data-act="corte-pdf" data-id="${c.id}">PDF</button></div></div>`).join("") || `<div class="empty">Aún no hay cortes.</div>`;
  if (!S.turno.abierto){
    return `<div class="two"><div class="panel"><h3>La caja está cerrada</h3><p class="muted">Para vender, abre la caja con el efectivo que hay para dar cambio.</p>

      <div class="list"><h3>Cortes anteriores</h3>${hist}</div>`;
  }
  const r = resumenTurno(), esperado = S.turno.fondo + r.efectivo;

      <div class="panel"><h3>Ventas del turno</h3><div class="donut-wrap">${donut([{ l:"Efectivo", v:r.efectivo, c:"var(--lager)" },{ l:"Tarjeta", v:r.tarjeta, c:"var(--vidrio)" }])}<div class="legend"><span><i style="background:var(--lager)"></i>Efectivo ${money(r.efectivo)}</span><span><i style="background:var(--vidrio)"></i>Tarjeta ${money(r.tarjeta)}</span><span class="muted">${plural(r.ventas,"venta","ventas")}${r.canceladas ? `, ${plural(r.canceladas,"cancelada","canceladas")}` : ""}</span></div></div></div>
      <div class="panel"><h3>Arqueo</h3>
        <div class="kv"><span>Turno abierto a las</span><b>${fHora(S.turno.apertura)}</b></div>
        <div class="kv"><span>Fondo inicial</span><b>${money(S.turno.fondo)}</b></div>

        <div class="kv sum"><span>Debe haber en caja</span><b style="font-size:22px">${money(esperado)}</b></div></div></div>
    <div class="two"><div class="panel"><h3>Cerrar el turno</h3>
        <label class="field">Efectivo contado en caja<input id="contado" type="number" inputmode="decimal" placeholder="0"></label>
        <div style="min-height:30px;font-weight:600;margin-bottom:8px" id="diff"></div>
        <button class="btn btn-primary btn-lg full" data-act="cerrar-caja" id="btn-cerrar" disabled>Cerrar caja</button></div>
      <div class="list"><h3>Cortes anteriores</h3>${hist}</div></div>`;
}

function vAlertas(){
  const a = alertas();
  return `<div class="two">
    <div class="list"><h3>Poco stock</h3>${a.low.length ? a.low.map(p => `<div class="li"><div class="who">${imgProd(p)}<div><b>${esc(p.nombre)}</b><small>Hay ${stockTxt(p)}; mínimo ${p.min} pz</small><div class="bar" style="width:160px"><i style="width:${Math.min(100, Math.round(p.stock / p.min * 100))}%;background:var(--alerta)"></i></div></div></div><div class="acts"><button class="btn btn-sm btn-primary" data-act="recibir" data-id="${p.id}">Recibir</button></div></div>`).join("") : `<div class="empty">${EMPTY_SVG}Todo está sobre su mínimo.</div>`}</div>
    <div class="list"><h3>Caducan pronto</h3>${a.cad.length ? a.cad.map(p => { const d = diasPara(p.cad); return `<div class="li"><div class="who">${imgProd(p)}<div><b>${esc(p.nombre)}</b><small>${fCad(p.cad)}, ${stockTxt(p)} en existencia</small></div></div><div class="acts"><span class="tag ${d <= 7 ? "low" : "warn"}">${d < 0 ? "Vencido" : d === 0 ? "Vence hoy" : "En " + plural(d,"día","días")}</span><button class="btn btn-sm" data-act="prod-editar" data-id="${p.id}">Editar</button></div></div>`; }).join("") : `<div class="empty">${EMPTY_SVG}Nada vence en los próximos ${S.ajustes.alertaCad} días.</div>`}</div></div>
    <p class="note">Se avisa ${S.ajustes.alertaCad} días antes de la caducidad y cuando un producto baja de su mínimo. Cámbialo en Ajustes o en cada producto.</p>`;

function vResurtido(){
  const sg = sugerencias();
  if (!U.resSel) U.resSel = new Set(sg.filter(s => s.cant > 0).map(s => s.p.id));
  const top = sg.slice().sort((a,b) => b.vendidas - a.vendidas).slice(0,6); const max = top[0] ? top[0].vendidas || 1 : 1;
  const sel = sg.filter(s => s.cant > 0 && U.resSel.has(s.p.id));
  return `<div class="two" style="grid-template-columns:1fr 1.6fr">
    <div class="card"><div class="card-h"><h3>Productos estrella, 30 días</h3></div>${top.map((s,i) => `<div class="rank">${imgProd(s.p)}<div class="info"><div style="display:flex;justify-content:space-between;gap:8px"><b>${i + 1}. ${esc(s.p.nombre)}</b><span>${s.vendidas} pz</span></div><div class="bar"><i style="width:${Math.round(s.vendidas/max*100)}%"></i></div></div></div>`).join("")}</div>
    <div><div class="row-actions"><label class="field" style="margin:0;flex-direction:row;align-items:center;gap:10px">Cubrir<input id="cobertura" type="number" min="1" max="60" value="${S.ajustes.cobertura}" style="width:84px">días</label>
      <button class="btn btn-primary" data-act="res-pedido" ${sel.length ? "" : "disabled"}>${ico("resurtido")}Generar pedido (${sel.length})</button></div>
      <div class="table-wrap"><table><thead><tr><th></th><th>Producto</th><th class="num">Venta diaria</th><th class="num">Alcanza para</th><th>Sugerido</th></tr></thead><tbody>
      ${sg.map(s => `<tr><td>${s.cant > 0 ? `<input type="checkbox" data-res="${s.p.id}" ${U.resSel.has(s.p.id) ? "checked" : ""} aria-label="Incluir ${esc(s.p.nombre)}" style="width:20px;height:20px">` : ""}</td>
        <td><div class="cell-prod">${imgProd(s.p)}<div>${esc(s.p.nombre)}<small>${stockTxt(s.p)} en existencia</small></div></div></td><td class="num">${s.vd.toFixed(1)} pz</td>
        <td class="num">${s.alcanza === Infinity ? "Sin ventas" : `<span class="${s.alcanza <= 2 ? "diff-bad" : ""}">${plural(s.alcanza,"día","días")}</span>`}</td>
        <td>${s.cant > 0 ? `<b>${s.txt}</b>` : `<span class="muted">${s.txt}</span>`}</td></tr>`).join("")}
      </tbody></table></div>
      <p class="note">Sugerido = venta diaria de los últimos 30 días × días a cubrir + mínimo − existencia, redondeado a cajas completas.</p></div></div>`;
}

const SCREENS = { inicio:vInicio, vender:vVender, ventas:vVentas, catalogo:vCatalogo, envases:vEnvases, corte:vCorte, alertas:vAlertas, resurtido:vResurtido, ajustes:vAjustes };

function vTerminal(){
  const T = { escanear:"Escanear", pedido:"Pedido", stock:"Productos", ajustes:"Ajustes" };
  const n = U.tcart.reduce((a,l)=>a+l.qty,0);

let lastKey = "";
function render(){
  const rol = getRol();
  const key = rol + (rol === "caja" ? U.screen : U.tScreen);
  const a = document.activeElement;
  const fid = a && a.id && $("#app").contains(a) ? a.id : null;
  let ss = null, se = null; try { ss = a.selectionStart; se = a.selectionEnd; } catch(e){}
  const scr = {};
  if (key === lastKey) document.querySelectorAll("#app [data-scroll]").forEach(el => { scr[el.id] = el.scrollTop; });
  $("#app").className = rol ? "r-" + rol : "r-start"; document.body.dataset.rol = rol || "start";
  $("#app").innerHTML = !rol ? vStart() : rol === "caja" ? vCaja() : vTerminal();
  for (const id in scr){ const el = document.getElementById(id); if (el) el.scrollTop = scr[id]; }
  if (fid && key === lastKey){ const el = document.getElementById(fid); if (el){ el.focus({ preventScroll:true }); try { if (ss != null) el.setSelectionRange(ss, se); } catch(e){} } }
  lastKey = key;
}

function volar(fromEl, toSel){
  if (reduceMotion() || !fromEl) return null;
  const img = fromEl.querySelector(".pimg"); if (!img) return null;
  const a = img.getBoundingClientRect(), cl = img.cloneNode(true);
  Object.assign(cl.style, { position:"fixed", left:a.left + "px", top:a.top + "px", width:a.width + "px", height:a.height + "px", zIndex:70, pointerEvents:"none", margin:0 });
  return () => {
    const to = $(toSel); if (!to){ return; }
    const b = to.getBoundingClientRect(); document.body.appendChild(cl);
    const dx = b.left + 40 - (a.left + a.width/2), dy = b.top + 60 - (a.top + a.height/2);
    const an = cl.animate([{ transform:"translate(0,0) scale(1)", opacity:1 }, { transform:`translate(${dx}px,${dy}px) scale(.25)`, opacity:.3 }], { duration:420, easing:"cubic-bezier(.5,0,.75,1)" });
    an.onfinish = () => cl.remove();
  };
}

    case "ccat": U.catCat = d.c; render(); break;
    case "vf": U.vf = d.f; render(); break;
    case "add": { const fly = volar(b, "#lines"); if (addCart(U.cart, d.id, "pieza", true)){ U.flash = d.id; render(); if (fly) fly(); } else render(); break; }
    case "unit": { const l = U.cart[+d.i], old = l.unidad; l.unidad = d.u; if (enCarrito(U.cart, l.pid) > P(l.pid).stock){ l.unidad = old; toast("No hay suficiente existencia para venderlo por caja"); } else { const dup = U.cart.find((x,j) => j !== +d.i && x.pid === l.pid && x.unidad === l.unidad); if (dup){ dup.qty += l.qty; U.cart.splice(+d.i,1); } } render(); break; }
    case "inc": { const l = U.cart[+d.i]; if (addCart(U.cart, l.pid, l.unidad, true)) U.flash = l.pid; render(); break; }
    case "dec": { const l = U.cart[+d.i]; l.qty--; if (l.qty <= 0) U.cart.splice(+d.i,1); render(); break; }
    case "vaciar": U.cart = []; U.envModo = "cobrar"; U.envCliente = ""; render(); break;
    case "envmodo": U.envModo = d.m; render(); if (d.m === "prestamo"){ const e = $("#envCliente"); if (e) e.focus(); } break;
    case "cobrar":
      if (!S.turno.abierto){ openModal(`<h2>La caja está cerrada</h2><p>Abre la caja para poder cobrar.</p><label class="field">Fondo inicial<input id="fondo-m" type="number" value="${S.ajustes.fondo}" autofocus></label><div class="modal-actions"><button class="btn" data-act="close">Cancelar</button><button class="btn btn-primary" data-act="abrir-caja" data-m="${d.m}">Abrir caja</button></div>`); break; }
      if (U.envModo === "prestamo" && envasesCart(U.cart).n && !U.envCliente.trim()){ toast("Escribe el nombre del cliente del préstamo"); const e = $("#envCliente"); if (e) e.focus(); break; }
      U.metodo = d.m; U.recibido = ""; modalCobro(); break;
    case "rec": U.recibido = String(d.v); updCambio(); break;
    case "kp": { const k = d.k; if (k === "⌫") U.recibido = U.recibido.slice(0,-1); else if (k === "." && U.recibido.includes(".")) break; else if (U.recibido.length < 8) U.recibido += k; updCambio(); break; }
    case "tt": U.tarjeta = d.v; b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); break;
    case "confirmar": { const r = registrarVenta(); render(); modalVentaHecha(r.v, r.nuevos); break; }
    case "t-pdf": case "t-share": { const v = venta(d.id), doc = v && pdfTicket(v); if (doc) await entregar(blobDe(doc), `ticket-${v.folio}.pdf`, act === "t-share"); break; }
    case "t-wa": { const v = venta(d.id); if (v) abrirWhatsApp(textoTicket(v)); break; }
    case "ped-cargar": {
      const pd = S.pedidos.find(x => x.id === d.id); if (!pd) break;
      pd.items.forEach(l => { for (let k = 0; k < l.qty; k++) addCart(U.cart, l.pid, l.unidad, false); });
      U.origen = pd.origen;
      S.pedidos = S.pedidos.filter(x => x.id !== d.id); save();
      const sobre = U.cart.some(l => enCarrito(U.cart, l.pid) > P(l.pid).stock);
      render(); toast(sobre ? "Pedido cargado. Revisa existencias: algún producto excede el stock." : "Pedido cargado al ticket"); break;
    }
    case "ped-descartar": S.pedidos = S.pedidos.filter(x => x.id !== d.id); save(); render(); break;
    case "scan": abrirScanner(d.ctx); break;
    case "scan-pick": onCodigo(d.code); break;
    case "scan-code": onCodigo(($("#scode") || {}).value); break;
    case "close": closeModal(); break;
    case "qr": modalQR(); break;
    case "venta-ver": { const v = venta(d.id); if (v) modalVenta(v); break; }
    case "venta-cancelar": openModal(`<h2>¿Cancelar la venta ${venta(d.id).folio}?</h2><p>El stock y los envases regresan al inventario y la venta ya no cuenta en el corte.</p><div class="modal-actions"><button class="btn" data-act="venta-ver" data-id="${d.id}">No, regresar</button><button class="btn btn-danger" data-act="venta-cancelar-ok" data-id="${d.id}">Cancelar venta</button></div>`); break;
    case "venta-cancelar-ok": { const v = venta(d.id); cancelarVenta(v); closeModal(); render(); toast(`Venta ${v.folio} cancelada`); break; }
    case "prod-ver": if (!ev.target.closest("button")) modalProdVer(P(d.id)); else if (ev.target.closest("button") === b) modalProdVer(P(d.id)); break;
    case "prod-nuevo": modalProducto(null, d.code); break;
    case "prod-editar": modalProducto(P(d.id)); break;
    case "prod-guardar": guardarProducto(); break;
    case "foto-quitar": U.form.foto = ""; refrescarPrev(); break;
    case "prod-borrar": openModal(`<h2>¿Eliminar ${esc(P(d.id).nombre)}?</h2><p>Se quita del catálogo. Las ventas anteriores se conservan.</p><div class="modal-actions"><button class="btn" data-act="prod-editar" data-id="${d.id}">No, regresar</button><button class="btn btn-danger" data-act="prod-borrar-ok" data-id="${d.id}">Eliminar</button></div>`); break;
    case "prod-borrar-ok": { const nm = P(d.id).nombre; S.productos = S.productos.filter(p => p.id !== d.id); U.cart = U.cart.filter(l => l.pid !== d.id); U.tcart = U.tcart.filter(l => l.pid !== d.id); save(); closeModal(); render(); toast(nm + " eliminado"); break; }
    case "recibir": modalRecibir(P(d.id)); break;
    case "recibir-ok": {
      const p = P(d.id), c = parseInt(($("#r-cajas") || {}).value, 10) || 0, pz = parseInt($("#r-pz").value, 10) || 0, cad = $("#r-cad").value;
      const add = c * (p.ppc || 0) + pz; if (add <= 0){ toast("Indica cuántas cajas o piezas llegaron"); break; }
      p.stock += add; if (cad && (!p.cad || cad < p.cad || diasPara(p.cad) < 0)) p.cad = cad;
      save(); closeModal(); render(); toast(`${p.nombre}: +${add} pz, ahora hay ${stockTxt(p)}`); break;
    }
    case "csv": await entregar(new Blob([csvInventario()], { type:"text/csv" }), `inventario-${isoDate(new Date())}.csv`, false); break;
    case "prestamo": openModal(`<h2>Registrar préstamo</h2><p>Envases que el cliente se lleva y regresará después.</p>
      <label class="field">Cliente<input id="p-cliente" placeholder="Nombre o negocio" autofocus></label>
      <div class="form"><label class="field">Envase<select id="p-formato">${Object.keys(ENVN).map(k => `<option value="${k}">${ENVN[k]}</option>`).join("")}</select></label><label class="field">Cantidad<input id="p-cant" type="number" min="1" value="12"></label></div>
      <div class="modal-actions"><button class="btn" data-act="close">Cancelar</button><button class="btn btn-primary" data-act="prestamo-ok">Registrar préstamo</button></div>`); break;
    case "prestamo-ok": {
      const cliente = $("#p-cliente").value.trim(), f = $("#p-formato").value, n = parseInt($("#p-cant").value, 10) || 0;
      if (!cliente){ toast("Escribe el nombre del cliente"); break; } if (n <= 0){ toast("La cantidad debe ser mayor a cero"); break; }
      S.prestamos.unshift({ id:uid(), cliente, formato:f, cant:n, fecha:new Date().toISOString() }); S.envases[f].prestados += n;
      save(); closeModal(); render(); toast(`Préstamo de ${n} envases a ${cliente} registrado`); break;
    }
    case "devolver": { const x = S.prestamos.find(p => p.id === d.id); openModal(`<h2>Registrar devolución</h2><p>${esc(x.cliente)} tiene ${plural(x.cant,"envase","envases")} ${ENVN[x.formato]}.</p><label class="field">Envases que regresa<input id="dv-cant" type="number" min="1" max="${x.cant}" value="${x.cant}" autofocus></label><div class="modal-actions"><button class="btn" data-act="close">Cancelar</button><button class="btn btn-primary" data-act="devolver-ok" data-id="${x.id}">Registrar devolución</button></div>`); break; }
    case "devolver-ok": {
      const x = S.prestamos.find(p => p.id === d.id), n = Math.min(x.cant, parseInt($("#dv-cant").value, 10) || 0);
      if (n <= 0){ toast("La cantidad debe ser mayor a cero"); break; }
      S.envases[x.formato].bodega += n; S.envases[x.formato].prestados = Math.max(0, S.envases[x.formato].prestados - n); x.cant -= n;
      if (x.cant <= 0) S.prestamos = S.prestamos.filter(p => p !== x);
      save(); closeModal(); render(); toast(`Devolución de ${n} envases registrada`); break;
    }
    case "vender-env": openModal(`<h2>Vender envases vacíos</h2><p>Se descuentan de los vacíos en bodega.</p>
      <div class="form"><label class="field">Envase<select id="ve-f">${Object.keys(ENVN).map(k => `<option value="${k}">${ENVN[k]} (${money(S.envases[k].precio)}, hay ${S.envases[k].bodega})</option>`).join("")}</select></label><label class="field">Cantidad<input id="ve-n" type="number" min="1" value="12" autofocus></label>
      <label class="field span">Pago<select id="ve-m"><option value="efectivo">Efectivo</option><option value="tarjeta">Tarjeta</option></select></label></div>
      <div class="modal-actions"><button class="btn" data-act="close">Cancelar</button><button class="btn btn-primary" data-act="vender-env-ok">Registrar venta</button></div>`); break;
    case "vender-env-ok": {
      if (!S.turno.abierto){ toast("Abre la caja en Corte de caja para vender"); break; }
      const f = $("#ve-f").value, n = parseInt($("#ve-n").value, 10) || 0, m = $("#ve-m").value;
      if (n <= 0 || n > S.envases[f].bodega){ toast(`Solo hay ${S.envases[f].bodega} vacíos ${ENVN[f]} en bodega`); break; }
      const precio = S.envases[f].precio, total = precio * n;
      S.envases[f].bodega -= n;
      const v = { id:uid(), folio:++S.folio, fecha:new Date().toISOString(), items:[{ pid:null, nombre:`Envase ${ENVN[f]} vacío`, unidad:"pieza", qty:n, precio, piezas:0 }], env:{modo:"na",n:0,monto:0}, envVacios:{formato:f,cant:n}, total, metodo:m, tarjeta: m === "tarjeta" ? "Débito" : "", recibido: m === "efectivo" ? total : 0, cambio:0, corteId:null, origen:"Caja", cancelada:false };
      S.ventas.push(v); save(); render(); modalVentaHecha(v, []); break;
    }
    case "recibir-env": openModal(`<h2>Recibir envases vacíos</h2><p>Para envases que llegan sin una venta, por ejemplo de un proveedor.</p>
      <div class="form"><label class="field">Envase<select id="re-f">${Object.keys(ENVN).map(k => `<option value="${k}">${ENVN[k]}</option>`).join("")}</select></label><label class="field">Cantidad<input id="re-n" type="number" min="1" value="24" autofocus></label></div>
      <div class="modal-actions"><button class="btn" data-act="close">Cancelar</button><button class="btn btn-primary" data-act="recibir-env-ok">Agregar a bodega</button></div>`); break;
    case "recibir-env-ok": { const f = $("#re-f").value, n = parseInt($("#re-n").value, 10) || 0; if (n <= 0){ toast("La cantidad debe ser mayor a cero"); break; } S.envases[f].bodega += n; save(); closeModal(); render(); toast(`${n} envases ${ENVN[f]} agregados a bodega`); break; }
    case "abrir-caja": {
      const inp = $("#fondo-m") || $("#fondo"); const f = parseFloat(inp && inp.value) || 0;
      S.turno = { abierto:true, fondo:f, apertura:new Date().toISOString() }; save(); closeModal(); render(); toast(`Caja abierta con ${money(f)} de fondo`);
      if (d.m && U.cart.length){ U.metodo = d.m; U.recibido = ""; modalCobro(); }
      break;
    }
    case "cerrar-caja": {
      const r = resumenTurno(), contado = parseFloat($("#contado").value); if (isNaN(contado)) break;
      const c = { id:uid(), apertura:S.turno.apertura, cierre:new Date().toISOString(), fondo:S.turno.fondo, efectivo:r.efectivo, tarjeta:r.tarjeta, ventas:r.ventas, canceladas:r.canceladas, contado, diferencia: Math.round((contado - (S.turno.fondo + r.efectivo)) * 100) / 100 };
      ventasTurno().forEach(v => { v.corteId = c.id; });
      S.cortes.push(c); S.turno = { abierto:false }; save(); render();
      openModal(`<h2>Caja cerrada</h2><p>${plural(c.ventas,"venta","ventas")}, efectivo ${money(c.efectivo)}, tarjeta ${money(c.tarjeta)}. ${c.diferencia === 0 ? "El efectivo cuadró exacto." : (c.diferencia > 0 ? "Sobraron " : "Faltaron ") + money(Math.abs(c.diferencia)) + "."}</p>
        <div class="share" style="grid-template-columns:1fr 1fr"><button class="btn" data-act="corte-pdf" data-id="${c.id}">Descargar corte en PDF</button><button class="btn" data-act="backup">Exportar respaldo</button></div>
        <div class="modal-actions"><button class="btn btn-primary" data-act="close">Listo</button></div>`);
      break;
    }
    case "corte-pdf": { const c = S.cortes.find(x => x.id === d.id), doc = c && pdfCorte(c); if (doc) await entregar(blobDe(doc), `corte-${isoDate(new Date(c.cierre))}.pdf`, false); break; }
    case "res-pedido": {
      const lines = sugerencias().filter(s => s.cant > 0 && U.resSel.has(s.p.id));
      openModal(`<h2>Pedido al proveedor</h2><p>Para cubrir ${S.ajustes.cobertura} días de venta.</p>
        <div class="list" style="margin-bottom:14px">${lines.map(s => `<div class="li"><div class="who">${imgProd(s.p)}<div><b>${esc(s.p.nombre)}</b><small>${esc(s.p.fmt)}</small></div></div><b>${s.txt}</b></div>`).join("")}</div>
        <div class="share"><button class="btn" data-act="res-pdf">Descargar PDF</button><button class="btn" data-act="res-wa">WhatsApp</button><button class="btn" data-act="res-copy">Copiar texto</button></div>
        <div class="modal-actions"><button class="btn btn-primary" data-act="close">Listo</button></div>`, "wide"); break;
    }
    case "res-pdf": { const lines = sugerencias().filter(s => s.cant > 0 && U.resSel.has(s.p.id)); const doc = pdfPedido(lines); if (doc) await entregar(blobDe(doc), `pedido-resurtido-${isoDate(new Date())}.pdf`, false); break; }
    case "res-wa": abrirWhatsApp(textoPedido(sugerencias().filter(s => s.cant > 0 && U.resSel.has(s.p.id)))); break;
    case "res-copy": try { await navigator.clipboard.writeText(textoPedido(sugerencias().filter(s => s.cant > 0 && U.resSel.has(s.p.id)))); toast("Pedido copiado"); } catch(e){ toast("No se pudo copiar"); } break;
    case "backup": await entregar(new Blob([JSON.stringify(S, null, 1)], { type:"application/json" }), `respaldo-deposito-${isoDate(new Date())}.json`, false); break;
    case "reset": openModal(`<h2>¿Restablecer los datos de ejemplo?</h2><p>Se borran las ventas, productos y cortes de este dispositivo y se cargan los datos iniciales.</p><div class="modal-actions"><button class="btn" data-act="close">Cancelar</button><button class="btn btn-danger" data-act="reset-ok">Restablecer</button></div>`); break;
    case "reset-ok": S = seed(); save(); U.cart = []; U.tcart = []; U.resSel = null; closeModal(); render(); toast("Datos de ejemplo restablecidos"); break;
    case "tver": { const p = P(d.id); openModal(`${tCard(p).replace('class="pcard"','class="pcard" style="margin:0;border:0;box-shadow:none;padding:0"')}<div class="modal-actions" style="margin-top:12px"><button class="btn" data-act="close">Cerrar</button></div>`); break; }
    case "tadd": { addCart(U.tcart, d.id, d.u, false); const p = P(d.id); try { navigator.vibrate && navigator.vibrate(20); } catch(e){} if (!$("#modal").hidden) closeModal(); toast(enCarrito(U.tcart, p.id) > p.stock ? `Ojo: solo hay ${stockTxt(p)}` : "Agregado al pedido"); render(); break; }
    case "tinc": { U.tcart[+d.i].qty++; render(); break; }
    case "tdec": { const l = U.tcart[+d.i]; l.qty--; if (l.qty <= 0) U.tcart.splice(+d.i,1); render(); break; }
    case "tcode": { U.scanCtx = "terminal"; onCodigo($("#tcode").value); break; }
    case "tenviar": {
      S = load() || S;
      S.pedidos.push({ id:uid(), origen:getTermName(), items:U.tcart.map(l => ({...l})), nota:U.tnota.trim(), fecha:new Date().toISOString() });
      save(); U.tcart = []; U.tnota = ""; U.tScreen = "escanear"; render(); toast("Pedido enviado a la caja"); break;
    }
  }
});

document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && !$("#modal").hidden){ closeModal(); return; }
  const t = ev.target;
  if (ev.key === "Enter"){
    if (t.id === "q"){ const p = byCode(t.value); if (p){ if (addCart(U.cart, p.id, "pieza", true)) U.flash = p.id; U.q = ""; render(); toast("Agregado: " + p.nombre); } }
    else if (t.id === "scode") onCodigo(t.value);
    else if (t.id === "tcode"){ U.scanCtx = "terminal"; onCodigo(t.value); }
    else if (t.id === "recibido"){ const b = $("#btn-confirmar"); if (b && !b.disabled) b.click(); }
    else if (t.matches && t.matches("tr[data-act]")) t.click();
  }
  if (ev.key === "F2" && getRol() === "caja"){ ev.preventDefault(); U.screen = "vender"; render(); const q = $("#q"); if (q) q.focus(); }
});

document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "q"){ U.q = t.value; render(); }
  else if (t.id === "catq"){ U.catQ = t.value; render(); }
  else if (t.id === "tq"){ U.tq = t.value; render(); }
  else if (t.id === "tnota") U.tnota = t.value;
  else if (t.id === "envCliente") U.envCliente = t.value;
  else if (t.id === "recibido"){ U.recibido = t.value; updCambio(); }
  else if (/^f-c[123]$/.test(t.id) && U.form){ U.form.ilus["c" + t.id.slice(-1)] = t.value; if (!U.form.foto) refrescarPrev(); }
  else if (t.id === "contado"){
    const r = resumenTurno(), esperado = S.turno.fondo + r.efectivo, c = parseFloat(t.value), el = $("#diff"), btn = $("#btn-cerrar");
    if (isNaN(c)){ el.innerHTML = ""; btn.disabled = true; return; }
    const d = Math.round((c - esperado) * 100) / 100;
    el.innerHTML = d === 0 ? `<span class="diff-ok">Cuadra exacto</span>` : d > 0 ? `<span class="diff-ok">Sobran ${money(d)}</span>` : `<span class="diff-bad">Faltan ${money(-d)}</span>`;
    btn.disabled = false;
  }
});

document.addEventListener("change", async ev => {
  const t = ev.target;
  if (t.id === "f-porcaja") $("#f-caja").hidden = !t.checked;
  else if (t.id === "f-forma" && U.form){ U.form.ilus.forma = t.value; if (!U.form.foto) refrescarPrev(); }
  else if (t.id === "f-cat" && U.form){ refrescarPrev(); }
  else if (t.id === "f-foto" && t.files && t.files[0] && U.form){
    try { U.form.foto = await leerFoto(t.files[0]); refrescarPrev(); toast("Foto lista. Guarda para aplicarla."); } catch(e){ toast("No se pudo leer la imagen"); }
  }
  else if (t.dataset && t.dataset.aj){ const k = t.dataset.aj; S.ajustes[k] = t.type === "number" ? Math.max(0, parseFloat(t.value) || 0) : (t.value.trim() || S.ajustes[k]); save(); render(); toast("Ajuste guardado"); }
  else if (t.dataset && t.dataset.env){ S.envases[t.dataset.env].precio = Math.max(0, parseFloat(t.value) || 0); save(); toast("Ajuste guardado"); }
  else if (t.id === "cobertura"){ S.ajustes.cobertura = Math.max(1, parseInt(t.value, 10) || 7); U.resSel = null; save(); render(); }
  else if (t.dataset && t.dataset.res){ if (t.checked) U.resSel.add(t.dataset.res); else U.resSel.delete(t.dataset.res); render(); }
  else if (t.id === "tname"){ setTermName(t.value.trim() || "Terminal"); render(); }
  else if (t.id === "import" && t.files && t.files[0]){
    const fr = new FileReader();
    fr.onload = () => { try { const d = JSON.parse(fr.result); if (!d || !Array.isArray(d.productos) || !d.envases) throw 0; S = d; save(); U.cart = []; render(); toast("Respaldo importado"); } catch(e){ toast("Ese archivo no es un respaldo válido"); } };
    fr.readAsText(t.files[0]);
  }
});

window.addEventListener("storage", ev => {
  if (ev.key === "pos-tema"){ aplicarTema(); render(); return; }
  if (ev.key !== KEY || !ev.newValue) return;
  let d; try { d = JSON.parse(ev.newValue); } catch(e){ return; }
  const antes = S.pedidos.length; S = d;
  if (getRol() === "caja" && S.pedidos.length > antes){ const pd = S.pedidos[S.pedidos.length-1]; toast(`Nuevo pedido de ${pd.origen}`); }
  render();
});

render();
if (getRol() === "caja"){ const a = alertas(); if (a.n) setTimeout(() => toast(`Tienes ${plural(a.n,"alerta","alertas")} de inventario`), 700); }
})();
</script>
</body>
</html>
